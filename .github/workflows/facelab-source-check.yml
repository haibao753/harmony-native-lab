name: FaceLab source checks

on:
  pull_request:
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.4.0.sh"
      - "scripts/check-facelab-0.4.1.sh"
      - "scripts/check-facelab-0.4.2.sh"
      - "scripts/check-facelab-0.4.3.sh"
      - "scripts/check-facelab-0.5.0.sh"
      - "scripts/check-facelab-0.5.2.sh"
      - "scripts/check-facelab-0.6.0.sh"
      - "scripts/check-facelab-0.7.0.sh"
      - "scripts/check-facelab-art-0.1.sh"
      - ".github/workflows/facelab-source-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.4.0.sh"
      - "scripts/check-facelab-0.4.2.sh"
      - "scripts/check-facelab-0.4.3.sh"
      - "scripts/check-facelab-0.5.0.sh"
      - "scripts/check-facelab-0.5.2.sh"
      - "scripts/check-facelab-0.6.0.sh"
      - "scripts/check-facelab-0.7.0.sh"
      - "scripts/check-facelab-art-0.1.sh"
      - ".github/workflows/facelab-source-check.yml"

permissions:
  contents: read

jobs:
  source-check:
    name: Validate FaceLab 0.7 split-screen probe, FacePen and gesture/GPU baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/check-facelab-0.5.2.sh
          bash -n scripts/check-facelab-0.6.0.sh
          bash -n scripts/check-facelab-0.7.0.sh
          bash -n scripts/check-facelab-art-0.1.sh
      - name: Check FaceLab 0.5.2 gesture and GPU source contracts
        run: bash scripts/check-facelab-0.5.2.sh
      - name: Check FaceLab 0.6.0 FacePen source contracts
        run: bash scripts/check-facelab-0.6.0.sh
      - name: Check FaceLab 0.7.0 split-screen probe contracts
        run: bash scripts/check-facelab-0.7.0.sh
      - name: Check FaceLab Art 0.1 liquid sculpture contracts
        run: bash scripts/check-facelab-art-0.1.sh
