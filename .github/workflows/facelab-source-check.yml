name: FaceLab source checks

on:
  pull_request:
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.4.0.sh"
      - "scripts/check-facelab-0.4.1.sh"
      - "scripts/check-facelab-0.4.2.sh"
      - "scripts/check-facelab-0.4.3.sh"
      - ".github/workflows/facelab-source-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.4.0.sh"
      - "scripts/check-facelab-0.4.2.sh"
      - "scripts/check-facelab-0.4.3.sh"
      - ".github/workflows/facelab-source-check.yml"

permissions:
  contents: read

jobs:
  source-check:
    name: Validate FaceLab 0.4.3 live heatmap and lite rendering contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/check-facelab-0.4.3.sh
      - name: Check FaceLab 0.4.3 source contracts
        run: bash scripts/check-facelab-0.4.3.sh
