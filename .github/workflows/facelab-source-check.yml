name: FaceLab source checks

on:
  pull_request:
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.5.0.sh"
      - ".github/workflows/facelab-source-check.yml"
  push:
    branches:
      - main
      - "feature/facelab-0.5.0-gpu-renderer"
    paths:
      - "apps/facelab/**"
      - "docs/facelab/**"
      - "scripts/check-facelab-0.5.0.sh"
      - ".github/workflows/facelab-source-check.yml"

permissions:
  contents: read

jobs:
  source-check:
    name: Validate FaceLab 0.5.0 native GPU renderer contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/check-facelab-0.5.0.sh
      - name: Check FaceLab 0.5.0 native GPU renderer contracts
        run: bash scripts/check-facelab-0.5.0.sh
